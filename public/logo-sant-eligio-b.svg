<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="logoTitleB">
  <title id="logoTitleB">Sant'Eligio — bozza B, medaglia incisa</title>
  <defs>
    <!-- single light source, upper-left, used consistently across every element -->
    <linearGradient id="b-rimLight" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#e8c874" />
      <stop offset="45%" stop-color="#c99a3d" />
      <stop offset="100%" stop-color="#7a5a18" />
    </linearGradient>
    <linearGradient id="b-wine" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#a8404f" />
      <stop offset="55%" stop-color="#74232f" />
      <stop offset="100%" stop-color="#3f1119" />
    </linearGradient>
    <radialGradient id="b-halo" cx="42%" cy="34%" r="65%">
      <stop offset="0%" stop-color="#fbf0c8" />
      <stop offset="55%" stop-color="#e0b563" />
      <stop offset="80%" stop-color="#a67d28" />
      <stop offset="100%" stop-color="#7a5a18" />
    </radialGradient>
    <linearGradient id="b-gold" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#f0d590" />
      <stop offset="40%" stop-color="#c99a3d" />
      <stop offset="75%" stop-color="#96711f" />
      <stop offset="100%" stop-color="#6b4f16" />
    </linearGradient>
    <linearGradient id="b-skin" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf6" />
      <stop offset="60%" stop-color="#ece0c4" />
      <stop offset="100%" stop-color="#c9b98f" />
    </linearGradient>
    <linearGradient id="b-beard" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#e7e2d4" />
      <stop offset="100%" stop-color="#b6ad96" />
    </linearGradient>
    <clipPath id="b-fieldClip">
      <circle cx="100" cy="100" r="82" />
    </clipPath>
    <filter id="b-lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1c1813" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#b-lift)">
    <!-- beveled rim: a dark base ring plus a bright arc catching the light top-left -->
    <circle cx="100" cy="100" r="97" fill="#2a1015" />
    <circle cx="100" cy="100" r="94" fill="url(#b-wine)" />
    <path d="M 22 78 A 78 78 0 0 1 78 22" fill="none" stroke="#c9707c" stroke-width="3" stroke-linecap="round" opacity="0.55" />
    <circle cx="100" cy="100" r="83" fill="url(#b-rimLight)" />
    <circle cx="100" cy="100" r="80.5" fill="#f7f1e3" />

    <!-- faint tricolour echo from the confraternity flag -->
    <g clip-path="url(#b-fieldClip)" opacity="0.1">
      <rect x="18" y="18" width="32" height="164" fill="#74232f" />
      <rect x="150" y="18" width="32" height="164" fill="#74232f" />
    </g>

    <!-- halo: layered rings to read as hammered gold rather than a flat disc -->
    <circle cx="100" cy="72" r="41" fill="url(#b-halo)" />
    <circle cx="100" cy="72" r="41" fill="none" stroke="#7a5a18" stroke-width="1.2" opacity="0.5" />
    <circle cx="100" cy="72" r="34" fill="none" stroke="#fbf0c8" stroke-width="1" opacity="0.45" />
    <g stroke="#fbf0c8" stroke-width="1" opacity="0.35">
      <path d="M 100 31 L 100 26" />
      <path d="M 130 42 L 134 38" />
      <path d="M 141 72 L 146 72" />
      <path d="M 130 102 L 134 106" />
      <path d="M 70 102 L 66 106" />
      <path d="M 59 72 L 54 72" />
      <path d="M 70 42 L 66 38" />
    </g>

    <!-- infulae: the two ribbons hanging from the mitre, behind the shoulders -->
    <path d="M 82 92 Q 78 130 82 168" fill="none" stroke="url(#b-gold)" stroke-width="7" stroke-linecap="round" />
    <path d="M 118 92 Q 122 130 118 168" fill="none" stroke="url(#b-gold)" stroke-width="7" stroke-linecap="round" />
    <path d="M 82 92 Q 78 130 82 168" fill="none" stroke="#3f1119" stroke-width="7" stroke-linecap="round" opacity="0" />

    <!-- crosier, rendered as a rounded metal rod with a highlight strand -->
    <path d="M 130 174 L 121 96" stroke="#5c4415" stroke-width="3.4" stroke-linecap="round" />
    <path d="M 129.3 172 L 120.6 97" stroke="url(#b-gold)" stroke-width="2.2" stroke-linecap="round" />
    <path
      d="M 121 96 Q 107 94 109 83 Q 111 74 123 76 Q 132 78 130 87 Q 128 94 121 96 Z"
      fill="none" stroke="#5c4415" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"
    />
    <path
      d="M 120.4 94.5 Q 109 92.5 110.6 83.5 Q 112.2 76.5 122 78 Q 129.5 79.5 128 87 Q 126.5 92.5 120.4 94.5 Z"
      fill="none" stroke="url(#b-gold)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"
    />

    <!-- cope: fabric folds via layered bands, diaper pattern, chevroned orphrey -->
    <path
      d="M 86 134 Q 66 139 61 159 Q 59 170 66 175 L 134 175 Q 141 170 139 159 Q 134 139 114 134
         Q 107 141 100 141 Q 93 141 86 134 Z"
      fill="url(#b-gold)" stroke="#3f1119" stroke-width="1.4" stroke-linejoin="round"
    />
    <g clip-path="url(#b-fieldClip)" opacity="0.5">
      <path d="M 61 159 Q 68 150 80 148" fill="none" stroke="#6b4f16" stroke-width="2.4" stroke-linecap="round" />
      <path d="M 66 175 Q 76 160 88 150" fill="none" stroke="#f0d590" stroke-width="1.6" opacity="0.6" stroke-linecap="round" />
      <path d="M 139 159 Q 132 150 120 148" fill="none" stroke="#6b4f16" stroke-width="2.4" stroke-linecap="round" />
      <path d="M 134 175 Q 124 160 112 150" fill="none" stroke="#f0d590" stroke-width="1.6" opacity="0.6" stroke-linecap="round" />
    </g>
    <g fill="#7a5a18" opacity="0.35">
      <circle cx="72" cy="158" r="1.4" /><circle cx="80" cy="166" r="1.4" /><circle cx="64" cy="168" r="1.4" />
      <circle cx="128" cy="158" r="1.4" /><circle cx="120" cy="166" r="1.4" /><circle cx="136" cy="168" r="1.4" />
    </g>
    <path d="M 94 142 L 92 175 L 108 175 L 106 142 Q 100 145 94 142 Z" fill="#74232f" stroke="#3f1119" stroke-width="1" />
    <g stroke="#e0b563" stroke-width="2.2" opacity="0.85">
      <path d="M 93.5 149 L 100 153 L 106.5 149" fill="none" />
      <path d="M 93.8 158 L 100 162 L 106.2 158" fill="none" />
      <path d="M 94 167 L 100 171 L 106 167" fill="none" />
    </g>

    <!-- hand raised in blessing: index + middle extended, ring + little finger
         folded into the palm, thumb crossing in front -->
    <path
      d="M 71 168 Q 66 168 65 161 Q 64 154 69 150 Q 74 147 81 148 Q 87 150 88 157
         Q 89 163 85 167 Q 80 170 71 168 Z"
      fill="url(#b-skin)" stroke="#5c4415" stroke-width="1.1" stroke-linejoin="round"
    />
    <rect x="70" y="132" width="6.5" height="21" rx="3.2" fill="url(#b-skin)" stroke="#5c4415" stroke-width="1.1" />
    <rect x="78.5" y="127" width="6.5" height="26" rx="3.2" fill="url(#b-skin)" stroke="#5c4415" stroke-width="1.1" />
    <path
      d="M 85 151 Q 92 149 93.5 155 Q 95 161 88.5 162 Q 84 162 83.5 158 Z"
      fill="url(#b-skin)" stroke="#5c4415" stroke-width="1"
    />
    <path d="M 70 161 Q 76 164 82 161" stroke="#c9b98f" stroke-width="0.7" fill="none" opacity="0.6" />
    <path d="M 73.2 152 L 73.2 149" stroke="#c9b98f" stroke-width="0.6" opacity="0.5" />
    <path d="M 81.7 152 L 81.7 148" stroke="#c9b98f" stroke-width="0.6" opacity="0.5" />

    <!-- mitre with jewelled circlet -->
    <path
      d="M 74 74 Q 76 44 94 30 Q 97 50 100 56 Q 103 50 106 30 Q 124 44 126 74 Z"
      fill="url(#b-gold)" stroke="#3f1119" stroke-width="1.4" stroke-linejoin="round"
    />
    <path d="M 94 30 Q 97 50 100 56" stroke="#f7e3ad" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.8" />
    <path d="M 106 30 Q 103 50 100 56" stroke="#7a5a18" stroke-width="1.2" fill="none" stroke-linecap="round" />
    <rect x="71" y="70" width="58" height="10" rx="3.5" fill="url(#b-gold)" stroke="#3f1119" stroke-width="1.4" />
    <g>
      <circle cx="80" cy="75" r="2.6" fill="#8f2d3b" stroke="#3f1119" stroke-width="0.6" />
      <circle cx="90" cy="75" r="2.6" fill="#e0b563" stroke="#3f1119" stroke-width="0.6" />
      <circle cx="100" cy="75" r="2.9" fill="#8f2d3b" stroke="#3f1119" stroke-width="0.6" />
      <circle cx="110" cy="75" r="2.6" fill="#e0b563" stroke="#3f1119" stroke-width="0.6" />
      <circle cx="120" cy="75" r="2.6" fill="#8f2d3b" stroke="#3f1119" stroke-width="0.6" />
    </g>

    <!-- ears, peeking from beneath the mitre lappets -->
    <path d="M 82 92 Q 78 94 79 99 Q 80 103 84 101" fill="url(#b-skin)" stroke="#3b332b" stroke-width="1" />
    <path d="M 118 92 Q 122 94 121 99 Q 120 103 116 101" fill="url(#b-skin)" stroke="#3b332b" stroke-width="1" />

    <!-- face, with a defined nose bridge and jaw -->
    <path
      d="M 82 78 C 80 93, 81 106, 87 114 Q 93 120 100 120 Q 107 120 113 114
         C 119 106, 120 93, 118 78 Q 109 87 100 87 Q 91 87 82 78 Z"
      fill="url(#b-skin)" stroke="#3b332b" stroke-width="1.3"
    />
    <!-- cheek shading, away from the light -->
    <path d="M 108 96 Q 116 100 114 110 Q 111 116 105 113 Q 111 106 108 96 Z" fill="#7a5a18" opacity="0.14" />

    <!-- brows -->
    <path d="M 89 97 q 4.5 -4 9 -0.5" stroke="#3b332b" stroke-width="1.3" fill="none" stroke-linecap="round" />
    <path d="M 102 96.5 q 4.5 -4 9 -0.5" stroke="#3b332b" stroke-width="1.3" fill="none" stroke-linecap="round" />
    <!-- eyes with iris + catchlight -->
    <path d="M 90 101.5 q 3 -1.8 6 0 q -3 2.4 -6 0 Z" fill="#f7f1e3" stroke="#3b332b" stroke-width="0.8" />
    <circle cx="93.2" cy="101.6" r="1.15" fill="#3b332b" />
    <circle cx="93.7" cy="101.1" r="0.35" fill="#ffffff" />
    <path d="M 104 101 q 3 -1.8 6 0 q -3 2.4 -6 0 Z" fill="#f7f1e3" stroke="#3b332b" stroke-width="0.8" />
    <circle cx="107.2" cy="101.1" r="1.15" fill="#3b332b" />
    <circle cx="107.7" cy="100.6" r="0.35" fill="#ffffff" />
    <!-- nose -->
    <path d="M 100 100 Q 102.5 106 101.5 110 Q 100.5 112 98.5 111" stroke="#3b332b" stroke-width="1" fill="none" stroke-linecap="round" />
    <path d="M 98.7 111.4 q 1.3 1 2.8 0" stroke="#3b332b" stroke-width="0.7" fill="none" opacity="0.7" />
    <!-- mouth, just visible above the moustache -->
    <path d="M 96.5 113.6 q 3.5 1.6 7 0" stroke="#8a5a4a" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.8" />

    <!-- beard and moustache, layered strands rather than a flat silhouette -->
    <path
      d="M 84 110 C 82 122, 83 135, 90 144 Q 95 150 100 152 Q 105 150 110 144
         C 117 135, 118 122, 116 110 Q 108 117 100 117 Q 92 117 84 110 Z"
      fill="url(#b-beard)" stroke="#3b332b" stroke-width="1.3"
    />
    <path d="M 100 118 L 100 149" stroke="#c9c2ad" stroke-width="0.7" opacity="0.6" />
    <g stroke="#c9c2ad" stroke-width="0.7" opacity="0.55" fill="none">
      <path d="M 90 121 Q 88 132 92 141" />
      <path d="M 96 123 Q 94 136 97 146" />
      <path d="M 104 123 Q 106 136 103 146" />
      <path d="M 110 121 Q 112 132 108 141" />
    </g>
    <path d="M 90 112 Q 100 116 110 112 Q 108 116 100 117 Q 92 116 90 112 Z" fill="url(#b-beard)" stroke="#3b332b" stroke-width="1" />
  </g>
</svg>
