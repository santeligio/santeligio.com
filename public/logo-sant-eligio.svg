<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="logoTitle">
  <title id="logoTitle">Sant'Eligio</title>
  <defs>
    <radialGradient id="halo" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#f7e7b0" />
      <stop offset="70%" stop-color="#c99a3d" />
      <stop offset="100%" stop-color="#9c7220" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0b563" />
      <stop offset="55%" stop-color="#c99a3d" />
      <stop offset="100%" stop-color="#a67d28" />
    </linearGradient>
    <linearGradient id="wineRing" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8f2d3b" />
      <stop offset="100%" stop-color="#5c1b26" />
    </linearGradient>
    <clipPath id="fieldClip">
      <circle cx="100" cy="100" r="82" />
    </clipPath>
  </defs>

  <!-- medallion base -->
  <circle cx="100" cy="100" r="97" fill="#3f1119" />
  <circle cx="100" cy="100" r="94" fill="url(#wineRing)" />
  <circle cx="100" cy="100" r="83" fill="#c99a3d" />
  <circle cx="100" cy="100" r="81" fill="#f7f1e3" />

  <!-- echo of the confraternity flag's tricolour bands -->
  <g clip-path="url(#fieldClip)" opacity="0.13">
    <rect x="18" y="18" width="34" height="164" fill="#74232f" />
    <rect x="148" y="18" width="34" height="164" fill="#74232f" />
  </g>

  <!-- halo -->
  <circle cx="100" cy="74" r="40" fill="url(#halo)" />

  <!-- crosier -->
  <path d="M 128 172 L 120 98" stroke="#a67d28" stroke-width="2.6" stroke-linecap="round" />
  <path
    d="M 120 98 Q 108 96 110 86 Q 112 78 122 80 Q 130 82 128 90 Q 126 96 120 98 Z"
    fill="none"
    stroke="#a67d28"
    stroke-width="2.6"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- shoulders / cope -->
  <path
    d="M 88 136
       Q 70 140 66 158
       Q 64 168 70 173
       L 130 173
       Q 136 168 134 158
       Q 130 140 112 136
       Q 106 142 100 142
       Q 94 142 88 136
       Z"
    fill="url(#gold)"
    stroke="#5c1b26"
    stroke-width="1.5"
    stroke-linejoin="round"
  />

  <!-- orphrey trim -->
  <path d="M 95 143 L 93 173 L 107 173 L 105 143 Q 100 146 95 143 Z" fill="#74232f" stroke="#5c1b26" stroke-width="1" />
  <path d="M 96 146 L 94.5 173" stroke="#c99a3d" stroke-width="0.8" opacity="0.6" />
  <path d="M 104 146 L 105.5 173" stroke="#c99a3d" stroke-width="0.8" opacity="0.6" />

  <!-- raised hand, blessing gesture -->
  <path
    d="M 74 163
       Q 70 158 71 151
       Q 72 145 75 143
       Q 78 141 78 146
       L 78 151
       L 80 151
       L 80 144
       Q 80 139 83 138
       Q 86 138 86 143
       L 86 152
       Q 89 152 90 156
       Q 91 160 88 164
       Q 82 168 74 163 Z"
    fill="#ece0c4"
    stroke="#3b332b"
    stroke-width="1.3"
    stroke-linejoin="round"
  />

  <!-- mitre -->
  <path
    d="M 76 74
       Q 78 46 94 32
       Q 97 50 100 56
       Q 103 50 106 32
       Q 122 46 124 74
       Z"
    fill="url(#gold)"
    stroke="#5c1b26"
    stroke-width="1.5"
    stroke-linejoin="round"
  />
  <path d="M 94 32 Q 97 50 100 56" stroke="#e8c874" stroke-width="1.2" fill="none" stroke-linecap="round" />
  <path d="M 106 32 Q 103 50 100 56" stroke="#e8c874" stroke-width="1.2" fill="none" stroke-linecap="round" />
  <rect x="73" y="70" width="54" height="9" rx="3" fill="#a67d28" stroke="#5c1b26" stroke-width="1.5" />
  <circle cx="100" cy="74.5" r="3.2" fill="#8f2d3b" stroke="#5c1b26" stroke-width="0.75" />

  <!-- face -->
  <path
    d="M 84 78
       C 82 92, 83 104, 88 112
       Q 94 118 100 118
       Q 106 118 112 112
       C 117 104, 118 92, 116 78
       Q 108 86 100 86
       Q 92 86 84 78
       Z"
    fill="#ece0c4"
    stroke="#3b332b"
    stroke-width="1.4"
  />

  <!-- brows / eyes -->
  <path d="M 90 97 q 4 -3.5 8 0" stroke="#3b332b" stroke-width="1.3" fill="none" stroke-linecap="round" />
  <path d="M 102 97 q 4 -3.5 8 0" stroke="#3b332b" stroke-width="1.3" fill="none" stroke-linecap="round" />
  <path d="M 99 102 q 1.5 4 -0.5 6.5" stroke="#3b332b" stroke-width="1" fill="none" stroke-linecap="round" />

  <!-- beard -->
  <path
    d="M 88 108
       C 86 119, 87 131, 92 139
       Q 96 145 100 147
       Q 104 145 108 139
       C 113 131, 114 119, 112 108
       Q 106 114 100 114
       Q 94 114 88 108
       Z"
    fill="#fdfbf6"
    stroke="#3b332b"
    stroke-width="1.4"
  />
</svg>
