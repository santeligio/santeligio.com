<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="logoTitle">
  <title id="logoTitle">Sant'Eligio</title>
  <defs>
    <linearGradient id="wine" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#a8404f" />
      <stop offset="55%" stop-color="#74232f" />
      <stop offset="100%" stop-color="#3f1119" />
    </linearGradient>
    <linearGradient id="rimLight" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#e8c874" />
      <stop offset="45%" stop-color="#c99a3d" />
      <stop offset="100%" stop-color="#7a5a18" />
    </linearGradient>
    <!-- vivid warm yellow halo: sampled directly from the flag photo, which
         reads a saturated lemon-gold, not the pale blue first assumed from a
         lower-resolution look (the blue was simultaneous-contrast against the
         warm parchment field, not the halo's own color) -->
    <radialGradient id="halo" cx="45%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#fbf3c8" />
      <stop offset="45%" stop-color="#f3e074" />
      <stop offset="80%" stop-color="#e8c93c" />
      <stop offset="100%" stop-color="#c9a52a" />
    </radialGradient>
    <linearGradient id="gold" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#f0d590" />
      <stop offset="40%" stop-color="#c99a3d" />
      <stop offset="75%" stop-color="#96711f" />
      <stop offset="100%" stop-color="#6b4f16" />
    </linearGradient>
    <linearGradient id="alb" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf6" />
      <stop offset="100%" stop-color="#e2d8bf" />
    </linearGradient>
    <!-- dusty rose stole, the detail most distinctive of the actual painting -->
    <linearGradient id="stole" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c98c93" />
      <stop offset="100%" stop-color="#a8636c" />
    </linearGradient>
    <linearGradient id="skin" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#f2e2c4" />
      <stop offset="60%" stop-color="#e4cd9f" />
      <stop offset="100%" stop-color="#bfa06e" />
    </linearGradient>
    <linearGradient id="beard" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fbf8ef" />
      <stop offset="55%" stop-color="#e9e1c9" />
      <stop offset="100%" stop-color="#c2b892" />
    </linearGradient>
    <clipPath id="fieldClip">
      <circle cx="100" cy="100" r="82" />
    </clipPath>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1c1813" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#lift)">
    <!-- medallion rim, bevelled toward a single upper-left light source -->
    <circle cx="100" cy="100" r="97" fill="#2a1015" />
    <circle cx="100" cy="100" r="94" fill="url(#wine)" />
    <path d="M 22 78 A 78 78 0 0 1 78 22" fill="none" stroke="#c9707c" stroke-width="3" stroke-linecap="round" opacity="0.55" />
    <circle cx="100" cy="100" r="83" fill="url(#rimLight)" />
    <circle cx="100" cy="100" r="80.5" fill="#f7f1e3" />

    <!-- echo of the flag's own red/white/red bands -->
    <g clip-path="url(#fieldClip)" opacity="0.1">
      <rect x="18" y="18" width="32" height="164" fill="#74232f" />
      <rect x="150" y="18" width="32" height="164" fill="#74232f" />
    </g>

    <!-- halo: vivid gold, as actually painted, with a deeper gold edge -->
    <circle cx="100" cy="72" r="40" fill="url(#halo)" />
    <circle cx="100" cy="72" r="40" fill="none" stroke="#a67d28" stroke-width="1.4" opacity="0.75" />

    <!-- crosier: the reference photo shows an ornate scrolled crook near
         head height, not a plain rod. A relocated dot was the wrong fix for
         the earlier "looks like an earring" problem — the real fix is
         drawing a recognizable hooked volute, offset clear of the ear -->
    <path d="M 128 176 L 132 100" stroke="#6b4f16" stroke-width="2.6" stroke-linecap="round" />
    <path d="M 131.3 174 L 135.3 101" stroke="url(#gold)" stroke-width="1.2" stroke-linecap="round" opacity="0.8" />
    <path
      d="M 132 100 Q 132 85 145 83 Q 156 82 155 92 Q 154 100 145 99.5 Q 140 99 140.5 94.5 Q 141 91.5 144 91.8"
      fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
    />
    <path
      d="M 132 100 Q 132 85 145 83 Q 156 82 155 92 Q 154 100 145 99.5 Q 140 99 140.5 94.5 Q 141 91.5 144 91.8"
      fill="none" stroke="#6b4f16" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"
    />

    <!-- cope: a plain gold cloak, opening at the chest onto the alb and stole -->
    <path
      d="M 85 133 Q 65 139 61 159 Q 59 170 66 176 L 134 176 Q 141 170 139 159 Q 135 139 115 133
         Q 106 145 100 145 Q 94 145 85 133 Z"
      fill="url(#gold)" stroke="#3f1119" stroke-width="1.4" stroke-linejoin="round"
    />
    <g opacity="0.5">
      <path d="M 61 159 Q 70 150 82 147" fill="none" stroke="#6b4f16" stroke-width="2.2" stroke-linecap="round" />
      <path d="M 139 159 Q 130 150 118 147" fill="none" stroke="#6b4f16" stroke-width="2.2" stroke-linecap="round" />
      <path d="M 66 176 Q 78 158 88 148" fill="none" stroke="#f0d590" stroke-width="1.4" opacity="0.6" stroke-linecap="round" />
    </g>

    <!-- alb, visible in the V of the cope -->
    <path d="M 91 138 Q 100 148 109 138 L 112 176 L 88 176 Z" fill="url(#alb)" stroke="#a8996f" stroke-width="1" />

    <!-- the stole: a diagonal rose band, the most distinctive mark of the real
         painting and absent from the earlier, more generic candidates -->
    <path
      d="M 108 139 L 118 145 L 96 178 L 86 172 Z"
      fill="url(#stole)" stroke="#7a4048" stroke-width="1"
    />
    <path d="M 110 143 L 92 174" stroke="#e8c2c7" stroke-width="0.8" opacity="0.5" />

    <!-- hand, raised toward the shoulder and angled outward rather than held
         at chest height, as in the painting. Same fused-palm-plus-two-fingers
         shape that reads clearly in the other candidates, just rotated and
         moved higher, rather than the free-form blob tried first -->
    <g transform="rotate(-32 75 152)">
      <path
        d="M 70 172 Q 65 172 64 165 Q 63 158 68 154 Q 73 151 80 152 Q 86 154 87 161
           Q 88 167 84 171 Q 79 174 70 172 Z"
        fill="url(#skin)" stroke="#5c4415" stroke-width="1.1" stroke-linejoin="round"
      />
      <rect x="69" y="136" width="6.5" height="21" rx="3.2" fill="url(#skin)" stroke="#5c4415" stroke-width="1.1" />
      <rect x="77.5" y="131" width="6.5" height="26" rx="3.2" fill="url(#skin)" stroke="#5c4415" stroke-width="1.1" />
      <path
        d="M 84 155 Q 91 153 92.5 159 Q 94 165 87.5 166 Q 83 166 82.5 162 Z"
        fill="url(#skin)" stroke="#5c4415" stroke-width="1"
      />
      <path d="M 69 165 Q 75 168 81 165" stroke="#c9b98f" stroke-width="0.7" fill="none" opacity="0.6" />
    </g>

    <!-- ears -->
    <path d="M 83 92 Q 79 94 80 99 Q 81 103 85 101" fill="url(#skin)" stroke="#5c4415" stroke-width="1" />
    <path d="M 117 92 Q 121 94 120 99 Q 119 103 115 101" fill="url(#skin)" stroke="#5c4415" stroke-width="1" />

    <!-- mitre: plain gold, no jewels; the painting shows an unadorned band -->
    <path
      d="M 75 74 Q 77 45 94 30 Q 97 50 100 56 Q 103 50 106 30 Q 123 45 125 74 Z"
      fill="url(#gold)" stroke="#3f1119" stroke-width="1.4" stroke-linejoin="round"
    />
    <path d="M 94 30 Q 97 50 100 56" stroke="#f7e3ad" stroke-width="1.1" fill="none" stroke-linecap="round" opacity="0.75" />
    <path d="M 106 30 Q 103 50 100 56" stroke="#7a5a18" stroke-width="1.1" fill="none" stroke-linecap="round" />
    <rect x="72" y="70" width="56" height="9" rx="3" fill="#a67d28" stroke="#3f1119" stroke-width="1.4" />
    <path d="M 72 74.5 L 128 74.5" stroke="#7a5a18" stroke-width="0.8" opacity="0.5" />
    <!-- small quatrefoil emblem on the front panel, faint in the source but present -->
    <path
      d="M 100 48 Q 102.5 50.5 100 53 Q 97.5 50.5 100 48 M 100 48 Q 97.5 45.5 100 43 Q 102.5 45.5 100 48
         M 97.5 50.5 Q 95 48 92.5 50.5 Q 95 53 97.5 50.5 M 102.5 50.5 Q 105 48 107.5 50.5 Q 105 53 102.5 50.5"
      fill="none" stroke="#8a6a1e" stroke-width="1" opacity="0.6"
    />

    <!-- face: fuller and rounder than first drawn — the clearer reference
         crop shows soft, fleshy cheeks, not a gaunt, hollow face -->
    <path
      d="M 83 80 C 81 95, 82 108, 88 117 Q 94 124 100 124 Q 106 124 112 117
         C 118 108, 119 95, 117 80 Q 109 88 100 88 Q 91 88 83 80 Z"
      fill="url(#skin)" stroke="#5c4415" stroke-width="1.2"
    />
    <!-- soft cheek shading, following the roundness rather than hollowing it -->
    <path d="M 110 100 Q 116 106 112 114" stroke="#c9a56a" stroke-width="1.4" fill="none" opacity="0.35" stroke-linecap="round" />
    <path d="M 90 100 Q 84 106 88 114" stroke="#c9a56a" stroke-width="1.4" fill="none" opacity="0.35" stroke-linecap="round" />

    <!-- brows: medium brown-grey, angled down toward the nose, giving the
         solemn, slightly furrowed look visible in the painting -->
    <path d="M 98 95.5 q -5 1.5 -10 3" stroke="#7a6a48" stroke-width="1.4" fill="none" stroke-linecap="round" />
    <path d="M 102 95.5 q 5 1.5 10 3" stroke="#7a6a48" stroke-width="1.4" fill="none" stroke-linecap="round" />
    <!-- deep-set eyes -->
    <path d="M 90 102.5 q 3 -1.2 6 0" stroke="#3b332b" stroke-width="1" fill="none" stroke-linecap="round" />
    <circle cx="93.3" cy="103" r="0.9" fill="#3b332b" />
    <path d="M 104 102.5 q 3 -1.2 6 0" stroke="#3b332b" stroke-width="1" fill="none" stroke-linecap="round" />
    <circle cx="107.3" cy="103" r="0.9" fill="#3b332b" />
    <!-- straight nose with a slight bulb at the tip -->
    <path d="M 99.3 100 Q 101.8 107 101.4 111.5 Q 101.2 114 98 113" stroke="#5c4415" stroke-width="1" fill="none" stroke-linecap="round" />
    <path d="M 96.5 113.5 Q 98.5 115.3 100.5 114.6" stroke="#8a6a3a" stroke-width="0.8" fill="none" opacity="0.5" />

    <!-- beard: full and rounded at the base; moustache blends into it but a
         faint neutral mouth line is visible beneath, as in the painting -->
    <path
      d="M 85 110 C 83 121, 84 133, 91 142 Q 96 148 100 149 Q 104 148 109 142
         C 116 133, 117 121, 115 110 Q 108 116 100 116 Q 92 116 85 110 Z"
      fill="url(#beard)" stroke="#5c4415" stroke-width="1.2"
    />
    <path d="M 90 113 Q 100 117 110 113 Q 108 116.5 100 117.2 Q 92 116.5 90 113 Z" fill="url(#beard)" stroke="#5c4415" stroke-width="0.9" />
    <path d="M 95 118.5 Q 100 120.3 105 118.5" stroke="#7a5a3a" stroke-width="0.9" fill="none" opacity="0.55" stroke-linecap="round" />
    <g stroke="#c9bfa0" stroke-width="0.6" opacity="0.55" fill="none">
      <path d="M 91 119 Q 89 129 93 138" />
      <path d="M 97 121 Q 96 133 98 143" />
      <path d="M 103 121 Q 104 133 102 143" />
      <path d="M 109 119 Q 111 129 107 138" />
    </g>
  </g>
</svg>
