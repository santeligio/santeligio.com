<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="logoTitleD">
  <title id="logoTitleD">Sant'Eligio — bozza D, fedele al dipinto della bandiera</title>
  <defs>
    <linearGradient id="d-wine" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#a8404f" />
      <stop offset="55%" stop-color="#74232f" />
      <stop offset="100%" stop-color="#3f1119" />
    </linearGradient>
    <linearGradient id="d-rimLight" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#e8c874" />
      <stop offset="45%" stop-color="#c99a3d" />
      <stop offset="100%" stop-color="#7a5a18" />
    </linearGradient>
    <!-- pale sky-blue halo, as painted on the flag, rather than a gold disc -->
    <radialGradient id="d-halo" cx="45%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#f3f8fb" />
      <stop offset="55%" stop-color="#d9e8ee" />
      <stop offset="85%" stop-color="#aecbd8" />
      <stop offset="100%" stop-color="#8fb2c2" />
    </radialGradient>
    <linearGradient id="d-gold" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#f0d590" />
      <stop offset="40%" stop-color="#c99a3d" />
      <stop offset="75%" stop-color="#96711f" />
      <stop offset="100%" stop-color="#6b4f16" />
    </linearGradient>
    <linearGradient id="d-alb" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf6" />
      <stop offset="100%" stop-color="#e2d8bf" />
    </linearGradient>
    <!-- dusty rose stole, the detail most distinctive of the actual painting -->
    <linearGradient id="d-stole" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c98c93" />
      <stop offset="100%" stop-color="#a8636c" />
    </linearGradient>
    <linearGradient id="d-skin" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#f2e2c4" />
      <stop offset="60%" stop-color="#e4cd9f" />
      <stop offset="100%" stop-color="#bfa06e" />
    </linearGradient>
    <linearGradient id="d-beard" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fbf8ef" />
      <stop offset="55%" stop-color="#e9e1c9" />
      <stop offset="100%" stop-color="#c2b892" />
    </linearGradient>
    <clipPath id="d-fieldClip">
      <circle cx="100" cy="100" r="82" />
    </clipPath>
    <filter id="d-lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1c1813" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#d-lift)">
    <!-- medallion rim, bevelled toward a single upper-left light source -->
    <circle cx="100" cy="100" r="97" fill="#2a1015" />
    <circle cx="100" cy="100" r="94" fill="url(#d-wine)" />
    <path d="M 22 78 A 78 78 0 0 1 78 22" fill="none" stroke="#c9707c" stroke-width="3" stroke-linecap="round" opacity="0.55" />
    <circle cx="100" cy="100" r="83" fill="url(#d-rimLight)" />
    <circle cx="100" cy="100" r="80.5" fill="#f7f1e3" />

    <!-- echo of the flag's own red/white/red bands -->
    <g clip-path="url(#d-fieldClip)" opacity="0.1">
      <rect x="18" y="18" width="32" height="164" fill="#74232f" />
      <rect x="150" y="18" width="32" height="164" fill="#74232f" />
    </g>

    <!-- halo: pale blue, as painted, with a thin gold edge -->
    <circle cx="100" cy="72" r="40" fill="url(#d-halo)" />
    <circle cx="100" cy="72" r="40" fill="none" stroke="#c99a3d" stroke-width="1.4" opacity="0.7" />

    <!-- crosier: a plain staff, held at the chest and running to the ground.
         Kept below the shoulder line so its finial doesn't collide with the
         ear, which is what made it read as a stray earring at first -->
    <path d="M 128 176 L 124 124" stroke="#6b4f16" stroke-width="2.6" stroke-linecap="round" />
    <circle cx="124.4" cy="121" r="2.4" fill="url(#d-gold)" stroke="#6b4f16" stroke-width="1" />
    <path d="M 127.3 174 L 123.7 125" stroke="url(#d-gold)" stroke-width="1.2" stroke-linecap="round" opacity="0.8" />

    <!-- cope: a plain gold cloak, opening at the chest onto the alb and stole -->
    <path
      d="M 85 133 Q 65 139 61 159 Q 59 170 66 176 L 134 176 Q 141 170 139 159 Q 135 139 115 133
         Q 106 145 100 145 Q 94 145 85 133 Z"
      fill="url(#d-gold)" stroke="#3f1119" stroke-width="1.4" stroke-linejoin="round"
    />
    <g opacity="0.5">
      <path d="M 61 159 Q 70 150 82 147" fill="none" stroke="#6b4f16" stroke-width="2.2" stroke-linecap="round" />
      <path d="M 139 159 Q 130 150 118 147" fill="none" stroke="#6b4f16" stroke-width="2.2" stroke-linecap="round" />
      <path d="M 66 176 Q 78 158 88 148" fill="none" stroke="#f0d590" stroke-width="1.4" opacity="0.6" stroke-linecap="round" />
    </g>

    <!-- alb, visible in the V of the cope -->
    <path d="M 91 138 Q 100 148 109 138 L 112 176 L 88 176 Z" fill="url(#d-alb)" stroke="#a8996f" stroke-width="1" />

    <!-- the stole: a diagonal rose band, the most distinctive mark of the real
         painting and absent from the earlier, more generic candidates -->
    <path
      d="M 108 139 L 118 145 L 96 178 L 86 172 Z"
      fill="url(#d-stole)" stroke="#7a4048" stroke-width="1"
    />
    <path d="M 110 143 L 92 174" stroke="#e8c2c7" stroke-width="0.8" opacity="0.5" />

    <!-- hand, raised toward the shoulder and angled outward rather than held
         at chest height, as in the painting. Same fused-palm-plus-two-fingers
         shape that reads clearly in the other candidates, just rotated and
         moved higher, rather than the free-form blob tried first -->
    <g transform="rotate(-32 75 152)">
      <path
        d="M 70 172 Q 65 172 64 165 Q 63 158 68 154 Q 73 151 80 152 Q 86 154 87 161
           Q 88 167 84 171 Q 79 174 70 172 Z"
        fill="url(#d-skin)" stroke="#5c4415" stroke-width="1.1" stroke-linejoin="round"
      />
      <rect x="69" y="136" width="6.5" height="21" rx="3.2" fill="url(#d-skin)" stroke="#5c4415" stroke-width="1.1" />
      <rect x="77.5" y="131" width="6.5" height="26" rx="3.2" fill="url(#d-skin)" stroke="#5c4415" stroke-width="1.1" />
      <path
        d="M 84 155 Q 91 153 92.5 159 Q 94 165 87.5 166 Q 83 166 82.5 162 Z"
        fill="url(#d-skin)" stroke="#5c4415" stroke-width="1"
      />
      <path d="M 69 165 Q 75 168 81 165" stroke="#c9b98f" stroke-width="0.7" fill="none" opacity="0.6" />
    </g>

    <!-- ears -->
    <path d="M 83 92 Q 79 94 80 99 Q 81 103 85 101" fill="url(#d-skin)" stroke="#5c4415" stroke-width="1" />
    <path d="M 117 92 Q 121 94 120 99 Q 119 103 115 101" fill="url(#d-skin)" stroke="#5c4415" stroke-width="1" />

    <!-- mitre: plain gold, no jewels; the painting shows an unadorned band -->
    <path
      d="M 75 74 Q 77 45 94 30 Q 97 50 100 56 Q 103 50 106 30 Q 123 45 125 74 Z"
      fill="url(#d-gold)" stroke="#3f1119" stroke-width="1.4" stroke-linejoin="round"
    />
    <path d="M 94 30 Q 97 50 100 56" stroke="#f7e3ad" stroke-width="1.1" fill="none" stroke-linecap="round" opacity="0.75" />
    <path d="M 106 30 Q 103 50 100 56" stroke="#7a5a18" stroke-width="1.1" fill="none" stroke-linecap="round" />
    <rect x="72" y="70" width="56" height="9" rx="3" fill="#a67d28" stroke="#3f1119" stroke-width="1.4" />
    <path d="M 72 74.5 L 128 74.5" stroke="#7a5a18" stroke-width="0.8" opacity="0.5" />

    <!-- face: gaunt and solemn, no smile; the mouth in the painting is not
         visible, hidden entirely under the moustache -->
    <path
      d="M 84 79 C 82 93, 83 106, 88 115 Q 94 122 100 122 Q 106 122 112 115
         C 117 106, 118 93, 116 79 Q 108 87 100 87 Q 92 87 84 79 Z"
      fill="url(#d-skin)" stroke="#5c4415" stroke-width="1.2"
    />
    <!-- cheek hollows, away from the light -->
    <path d="M 109 98 Q 117 103 114 112 Q 111 117 106 114 Q 112 107 109 98 Z" fill="#7a5a18" opacity="0.16" />
    <path d="M 88 100 Q 84 106 87 112" stroke="#7a5a18" stroke-width="1" fill="none" opacity="0.18" />

    <!-- thin, pale brows; not dark and not arched high -->
    <path d="M 89 96.5 q 4.5 -2.5 9 -0.5" stroke="#8a7a55" stroke-width="1.2" fill="none" stroke-linecap="round" />
    <path d="M 102 96 q 4.5 -2.5 9 -0.5" stroke="#8a7a55" stroke-width="1.2" fill="none" stroke-linecap="round" />
    <!-- deep-set, solemn eyes -->
    <path d="M 90 101.8 q 3 -1.2 6 0" stroke="#3b332b" stroke-width="1" fill="none" stroke-linecap="round" />
    <circle cx="93.3" cy="102.3" r="0.9" fill="#3b332b" />
    <path d="M 104 101.4 q 3 -1.2 6 0" stroke="#3b332b" stroke-width="1" fill="none" stroke-linecap="round" />
    <circle cx="107.3" cy="101.9" r="0.9" fill="#3b332b" />
    <!-- long, straight nose -->
    <path d="M 99.3 99 Q 101.8 106 101 111 Q 100.3 113.5 98 112.6" stroke="#5c4415" stroke-width="1" fill="none" stroke-linecap="round" />

    <!-- beard: full and rounded at the base, moustache blending directly into
         it with no gap and no mouth line -->
    <path
      d="M 85 110 C 83 121, 84 133, 91 142 Q 96 148 100 149 Q 104 148 109 142
         C 116 133, 117 121, 115 110 Q 108 116 100 116 Q 92 116 85 110 Z"
      fill="url(#d-beard)" stroke="#5c4415" stroke-width="1.2"
    />
    <path d="M 90 113 Q 100 117 110 113 Q 108 116.5 100 117.2 Q 92 116.5 90 113 Z" fill="url(#d-beard)" stroke="#5c4415" stroke-width="0.9" />
    <g stroke="#c9bfa0" stroke-width="0.6" opacity="0.55" fill="none">
      <path d="M 91 119 Q 89 129 93 138" />
      <path d="M 97 121 Q 96 133 98 143" />
      <path d="M 103 121 Q 104 133 102 143" />
      <path d="M 109 119 Q 111 129 107 138" />
    </g>
  </g>
</svg>
