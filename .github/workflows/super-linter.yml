name: Lint Code Base

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  super-linter:
    name: Super-Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint code base
        uses: super-linter/super-linter/slim@v7
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          # ts-standard enforces standard style, which mandates no semicolons
          # and no trailing commas. This codebase uses both, and super-linter
          # also runs Prettier (TYPESCRIPT_PRETTIER), which actively adds them,
          # so the two linters can never both pass. It also fails to parse the
          # project at all, reporting errors in files a pull request never
          # touched. TYPESCRIPT_ES already covers linting.
          VALIDATE_TYPESCRIPT_STANDARD: false
          # Named explicitly rather than relying on the default lookup: when a
          # config is not found super-linter silently uses its own, which is
          # how the Prettier config sat unread in .github/linters/ for a while.
          TYPESCRIPT_ES_CONFIG_FILE: .eslintrc.yml
          # - devcontainer.json intentionally uses JSONC (inline comments), which
          #   trips the strict JSON/JSON_PRETTIER linters.
          # - CLAUDE.md is a symlink to AGENTS.md, not distinct content; without
          #   this it reads as a 100%-duplicate file to jscpd.
          FILTER_REGEX_EXCLUDE: (^|/)package-lock\.json$|(^|/)\.devcontainer/devcontainer\.json$|(^|/)CLAUDE\.md$
