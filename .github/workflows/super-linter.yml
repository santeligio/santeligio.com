name: Lint Code Base

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  super-linter:
    name: Super-Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint code base
        uses: super-linter/super-linter/slim@v7
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          # - devcontainer.json intentionally uses JSONC (inline comments), which
          #   trips the strict JSON/JSON_PRETTIER linters.
          # - CLAUDE.md is a symlink to AGENTS.md, not distinct content; without
          #   this it reads as a 100%-duplicate file to jscpd.
          FILTER_REGEX_EXCLUDE: (^|/)package-lock\.json$|(^|/)\.devcontainer/devcontainer\.json$|(^|/)CLAUDE\.md$
